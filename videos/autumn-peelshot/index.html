<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Vazirmatn";
        src: url("assets/Vazirmatn-Black.woff2") format("woff2");
        font-weight: 900;
      }
      :root {
        --bg-deep: #1c0b06;
        --bg-mid: #3a170b;
        --bg-warm: #6b2a10;
        --fg: #fbebd3;
        --accent: #f4a23a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg-deep);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
      }
      #scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--bg-deep);
      }
      #camera {
        position: absolute;
        inset: 0;
        transform-origin: 40% 55%;
        will-change: transform;
      }
      .layer {
        position: absolute;
        inset: 0;
      }

      /* ── background: natural autumn footage ── */
      #bg-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 85% 80% at 45% 50%, transparent 55%, rgb(12 5 2 / 55%) 100%);
      }
      #scrim {
        position: absolute;
        right: -120px;
        top: 80px;
        width: 760px;
        height: 860px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 60% 48%, rgb(22 9 3 / 72%) 0%, rgb(22 9 3 / 48%) 42%, transparent 70%);
      }
      /* ── product ── */
      #glow {
        position: absolute;
        left: -120px;
        top: 130px;
        width: 760px;
        height: 900px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 50% 46%, rgb(255 170 80 / 80%) 0%, rgb(220 110 30 / 40%) 38%, transparent 70%);
        opacity: 0;
      }
      #shadow {
        position: absolute;
        left: 30px;
        bottom: 52px;
        width: 520px;
        height: 80px;
        border-radius: 50%;
        background: radial-gradient(ellipse, rgb(6 2 1 / 92%) 0%, rgb(6 2 1 / 55%) 45%, transparent 72%);
        transform-origin: 50% 50%;
      }
      #product-wrap {
        position: absolute;
        left: 64px;
        bottom: 78px;
        width: 437px;
        height: 800px;
      }
      #product-float {
        width: 100%;
        height: 100%;
        transform-origin: 50% 100%;
      }
      #product-float img {
        display: block;
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 18px 30px rgb(10 4 2 / 55%));
      }

      /* ── copy ── */
      #copy {
        position: absolute;
        right: 72px;
        top: 214px;
        width: 480px;
        direction: rtl;
        text-align: right;
        font-family: "Vazirmatn", sans-serif;
        font-weight: 900;
        color: var(--fg);
        text-shadow: 0 6px 28px rgb(20 8 4 / 70%);
      }
      .line {
        display: block;
        font-size: 112px;
        line-height: 1.62;
        white-space: nowrap;
      }
      .word {
        display: inline-block;
        opacity: 0;
      }
      .line.accent {
        color: var(--accent);
      }
      #rule {
        display: block;
        width: 300px;
        height: 5px;
        margin: 6px 0 0 auto;
        border-radius: 3px;
        background: var(--accent);
        transform-origin: 100% 50%;
      }
      #brand {
        display: block;
        margin-top: 24px;
        direction: ltr;
        text-align: right;
        font-family: "Montserrat", sans-serif;
        font-weight: 600;
        font-size: 27px;
        letter-spacing: 0.2em;
        color: var(--fg);
        opacity: 0;
      }

      /* ── light leak (from registry block organic-light-leak-overlay, inlined for 1:1) ── */
      #leak {
        position: absolute;
        inset: -16%;
        opacity: 0;
        overflow: hidden;
        pointer-events: none;
        mix-blend-mode: screen;
      }
      #leak .leak-layer {
        position: absolute;
        inset: -20%;
        will-change: opacity, transform;
      }
      #leak .leak-amber {
        background:
          radial-gradient(ellipse 52% 110% at 10% 58%, rgb(255 241 197 / 92%), transparent 45%),
          radial-gradient(ellipse 72% 120% at 24% 54%, rgb(255 126 57 / 78%), transparent 66%);
        filter: blur(28px);
      }
      #leak .leak-red {
        background: radial-gradient(ellipse 58% 105% at 78% 34%, rgb(255 79 61 / 60%), rgb(255 44 92 / 20%) 48%, transparent 76%);
        filter: blur(40px);
      }
      #leak .leak-gold {
        background: linear-gradient(
          104deg,
          transparent 24%,
          rgb(255 144 62 / 30%) 40%,
          rgb(255 247 205 / 60%) 51%,
          rgb(255 124 48 / 22%) 62%,
          transparent 78%
        );
        filter: blur(20px);
      }

      /* ── grain (from registry component grain-overlay, timeline-driven) ── */
      #grain {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      #grain .grain-texture {
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        opacity: 0.13;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1080">
      <div id="scene">
        <div id="camera" data-layout-allow-overflow>
          <video id="bg-video" class="clip" src="assets/autumn-bg.mp4" muted playsinline data-start="0" data-duration="5" data-track-index="0"></video>
          <div id="vignette"></div>
          <div id="scrim" data-layout-allow-overflow></div>

          <div id="glow" data-layout-allow-overflow></div>
          <div id="shadow"></div>
          <div id="product-wrap">
            <div id="product-float">
              <img src="assets/peelshot-cutout.png" alt="Dr.Melaxin Peel Shot" />
            </div>
          </div>

          <div id="copy">
            <span class="line"><span class="word" id="w1">درخشش</span></span>
            <span class="line"><span class="word" id="w2">پاییزی</span></span>
            <span class="line accent"><span class="word" id="w3">پوست</span> <span class="word" id="w4">تو</span></span>
            <span id="rule"></span>
            <span id="brand">DR.MELAXIN · PEEL SHOT</span>
          </div>

          <div id="leak" aria-hidden="true" data-layout-allow-overflow>
            <div class="leak-layer leak-amber"></div>
            <div class="leak-layer leak-red"></div>
            <div class="leak-layer leak-gold"></div>
          </div>
        </div>
        <div id="grain"><div class="grain-texture"></div></div>
      </div>
    </div>

    <script>
      (function () {
        var DURATION = 5;
        var W = 1080;
        var H = 1080;
        var TAU = Math.PI * 2;

        // Seeded hash — every "random" value is a pure function of its index.
        function prand(n) {
          var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
          return x - Math.floor(x);
        }
        function lerp(a, b, k) {
          return a + (b - a) * k;
        }
        function clamp01(k) {
          return k < 0 ? 0 : k > 1 ? 1 : k;
        }
        var easeOut2 = gsap.parseEase("power2.out");
        var easeSine = gsap.parseEase("sine.inOut");

        var camera = document.getElementById("camera");
        var floatEl = document.getElementById("product-float");
        var glow = document.getElementById("glow");
        var grain = document.querySelector("#grain .grain-texture");

        // The one writer of every ambient property: a pure function of time.
        function update(t) {
          // multi-phase camera: pull back → hold → slow push, with Lissajous drift
          var s;
          if (t < 1.4) s = lerp(1.05, 1.0, easeOut2(t / 1.4));
          else if (t < 3.0) s = 1.0;
          else s = lerp(1.0, 1.02, easeSine(clamp01((t - 3.0) / 2.0)));
          var dx = Math.sin(t * TAU * 0.16) * 6;
          var dy = Math.sin(t * TAU * 0.16 * 1.3) * 5;
          camera.style.transform = "scale(" + s.toFixed(4) + ") translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px)";

          // product idle float (starts at rest: sin(0) = 0)
          floatEl.style.transform =
            "translateY(" + (Math.sin(t * 1.3) * -7).toFixed(2) + "px) rotate(" + (Math.sin(t * 0.9) * 0.6).toFixed(3) + "deg)";

          // glow blooms onto the product's settle, then breathes
          var go, gs;
          if (t < 1.0) {
            var k = easeOut2(clamp01((t - 0.1) / 0.9));
            go = 0.26 * k;
            gs = lerp(0.85, 1, k);
          } else {
            var bph = Math.sin(((t - 1.0) * TAU) / 3.0);
            go = 0.26 + bph * 0.03;
            gs = 1 + bph * 0.015;
          }
          glow.style.opacity = go.toFixed(3);
          glow.style.transform = "scale(" + gs.toFixed(4) + ")";

          var frame = Math.floor(t * 12);
          grain.style.transform =
            "translate(" + ((prand(frame * 3 + 1) - 0.5) * 30).toFixed(1) + "%," + ((prand(frame * 5 + 2) - 0.5) * 30).toFixed(1) + "%)";
        }

        var tl = gsap.timeline({ paused: true });

        var clock = { t: 0 };
        tl.to(clock, { t: DURATION, duration: DURATION, ease: "none", onUpdate: function () { update(clock.t); } }, 0);

        // Product arrives: rise + settle, contact shadow lands with it.
        tl.fromTo("#product-wrap", { y: 110, opacity: 0, scale: 0.96 }, { y: 0, opacity: 1, scale: 1, duration: 0.95, ease: "power3.out" }, 0.05);
        tl.fromTo("#shadow", { opacity: 0, scaleX: 0.6 }, { opacity: 1, scaleX: 1, duration: 0.9, ease: "power2.out" }, 0.15);

        // Slogan: waterfall entry, words whip up from below, binary opacity.
        var F = 1 / 30;
        var t0 = 0.95;
        tl.set("#w1", { opacity: 1, y: 80 }, t0);
        tl.to("#w1", { y: 0, duration: 0.2, ease: "power4.out" }, t0);
        var t1 = t0 + 0.2 + F;
        tl.set("#w2", { opacity: 1, y: 70 }, t1);
        tl.to("#w2", { y: 0, duration: 0.18, ease: "power4.out" }, t1);
        var t2 = t1 + 0.18;
        tl.set("#w3", { opacity: 1, y: 60 }, t2);
        tl.to("#w3", { y: 0, duration: 0.16, ease: "expo.out" }, t2);
        var t3 = t2 + 0.16 - F;
        tl.set("#w4", { opacity: 1, y: 48 }, t3);
        tl.to("#w4", { y: 0, duration: 0.13, ease: "expo.out" }, t3);

        // Accent rule draws from the right (RTL), brand line follows.
        tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 1.6);
        tl.fromTo("#brand", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.4)" }, 1.75);

        // Pattern interrupt: one warm light-leak pass.
        tl.fromTo("#leak", { opacity: 0 }, { opacity: 0.5, duration: 0.7, ease: "sine.out" }, 2.5);
        tl.to("#leak", { opacity: 0.28, duration: 0.5, ease: "sine.inOut" }, 3.3);
        tl.to("#leak", { opacity: 0, duration: 0.8, ease: "sine.in" }, 4.0);
        tl.fromTo("#leak .leak-amber", { xPercent: -20, scale: 0.92, rotation: -4 }, { xPercent: 18, scale: 1.1, rotation: 2, duration: 2.5, ease: "sine.inOut" }, 2.4);
        tl.fromTo("#leak .leak-red", { xPercent: 20, yPercent: -8, scale: 1.08 }, { xPercent: -16, yPercent: 8, scale: 0.94, duration: 2.5, ease: "sine.inOut" }, 2.4);
        tl.fromTo("#leak .leak-gold", { xPercent: -28, rotation: -6 }, { xPercent: 24, rotation: 4, duration: 2.5, ease: "sine.inOut" }, 2.4);

        update(0);
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
