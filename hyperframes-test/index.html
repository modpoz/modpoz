<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Vazirmatn";
        src: url("assets/Vazirmatn-Bold.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Vazirmatn";
        src: url("assets/Vazirmatn-Regular.woff2") format("woff2");
        font-weight: 400;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b1020;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: "Vazirmatn", sans-serif;
        background: radial-gradient(circle at 50% 40%, #1d2b5a 0%, #0b1020 70%);
      }
      #title,
      #subtitle {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        direction: rtl;
      }
      #title {
        top: 380px;
        color: #ffffff;
        font-size: 140px;
        font-weight: 700;
      }
      #subtitle {
        top: 600px;
        color: #9fb4ff;
        font-size: 56px;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <h1 id="title" class="clip" data-start="0" data-duration="5" data-track-index="0">
        سلام، هایپرفریمز!
      </h1>
      <p id="subtitle" class="clip" data-start="0" data-duration="5" data-track-index="1">
        این یک ویدیوی آزمایشی ۵ ثانیه‌ای است
      </p>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.2);
      tl.fromTo("#subtitle", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.9);
      tl.to(["#title", "#subtitle"], { opacity: 0, duration: 0.5, ease: "power1.in" }, 4.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
